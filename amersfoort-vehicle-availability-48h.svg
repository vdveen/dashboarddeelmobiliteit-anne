<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Voi vehicle availability in Amersfoort, 7 to 9 September 2026</title>
  <desc id="chart-desc">Line chart of the percentage of Voi vehicles marked non-operational within the municipality of Amersfoort. The vertical scale runs from 0 to 80 percent. Status was not recorded before 8 September at 11:00 CEST. The percentage then fell from 61.6 percent to 40.4 percent.</desc>
  <metadata>
    Source: https://voi-snapshot-api-production.up.railway.app/availability
    Boundary: PDOK BRK Bestuurlijke Gebieden, municipality GM0307
    Window: 2026-09-07T12:30:00Z to 2026-09-09T12:30:00Z
    Calculation: non_operational / total * 100; snapshots with unknown status omitted
  </metadata>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
