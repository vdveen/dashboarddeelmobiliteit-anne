name: Monitor Voi vehicle positions

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-voi-vehicles
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the collector
        uses: actions/checkout@v4

      - name: Collect Voi positions
        id: collect
        shell: bash
        run: |
          snapshot_path="$(python3 scripts/collect_voi_vehicles.py --output-dir "$RUNNER_TEMP")"
          snapshot_filename="$(basename "$snapshot_path")"
          artifact_name="${snapshot_filename%.geojson}"
          echo "path=$snapshot_path" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Validate the GeoJSON
        run: python3 -m json.tool "${{ steps.collect.outputs.path }}" > /dev/null

      - name: Store the snapshot for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
