name: Monitor Voi vehicle positions

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-voi-vehicles
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the collector
        uses: actions/checkout@v4

      - name: Collect Voi positions
        id: collect
        shell: bash
        run: |
          snapshot_path="$(python3 scripts/collect_voi_vehicles.py --output-dir "$RUNNER_TEMP")"
          snapshot_filename="$(basename "$snapshot_path")"
          artifact_name="${snapshot_filename%.geojson}"
          echo "path=$snapshot_path" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Validate the GeoJSON
        run: python3 -m json.tool "${{ steps.collect.outputs.path }}" > /dev/null

      - name: Store the snapshot for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Publish the snapshot for the viewer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          snapshot_path="${{ steps.collect.outputs.path }}"
          snapshot_name="${{ steps.collect.outputs.artifact_name }}"
          snapshot_month="${snapshot_name:13:7}"
          release_tag="voi-snapshots-$snapshot_month"

          gzip --best --keep "$snapshot_path"

          if ! gh release view "$release_tag" > /dev/null 2>&1; then
            gh release create "$release_tag" \
              --prerelease \
              --title "Voi vehicle snapshots $snapshot_month" \
              --notes "Public, compressed GeoJSON snapshots for the Voi timeline viewer."
          fi

          gh release upload "$release_tag" "$snapshot_path.gz" --clobber
