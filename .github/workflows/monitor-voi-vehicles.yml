name: Monitor Voi vehicle positions

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-voi-vehicles
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the collector
        uses: actions/checkout@v4

      - name: Collect Voi positions
        id: collect
        shell: bash
        run: |
          snapshot_path="$(python3 scripts/collect_voi_vehicles.py --output-dir "$RUNNER_TEMP")"
          snapshot_filename="$(basename "$snapshot_path")"
          artifact_name="${snapshot_filename%.geojson}"
          echo "path=$snapshot_path" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Validate the GeoJSON
        run: python3 -m json.tool "${{ steps.collect.outputs.path }}" > /dev/null

      - name: Store the snapshot for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Check out the public snapshot archive
        uses: actions/checkout@v4
        with:
          ref: voi-vehicle-data
          path: voi-vehicle-data

      - name: Publish the snapshot for the viewer
        shell: bash
        run: |
          snapshot_path="${{ steps.collect.outputs.path }}"
          snapshot_name="${{ steps.collect.outputs.artifact_name }}"
          snapshot_month="${snapshot_name:13:7}"
          archive_path="snapshots/${snapshot_month:0:4}/${snapshot_month:5:2}/${snapshot_name}.geojson.gz"

          gzip --best --keep "$snapshot_path"
          mkdir -p "voi-vehicle-data/$(dirname "$archive_path")"
          cp "$snapshot_path.gz" "voi-vehicle-data/$archive_path"

          cd voi-vehicle-data
          jq \
            --arg captured_at "${snapshot_name:13:10}T${snapshot_name:24:2}:${snapshot_name:27:2}:${snapshot_name:30:2}Z" \
            --arg path "$archive_path" \
            '. + [{captured_at: $captured_at, path: $path}] | unique_by(.path) | sort_by(.captured_at)' \
            index.json > index.next.json
          mv index.next.json index.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.json "$archive_path"
          git commit -m "Add Voi snapshot ${snapshot_name:13}"
          git push origin HEAD:voi-vehicle-data
